---
# NOTE: partials lazy-lookup under "plan_flows.<partial_name>" (no .show
# segment — house pattern, cf. plans.budget_card). show.html.erb itself is
# "plan_flows.show"; controller flashes are "plan_flows.<action>".
# M2 PR#2b: the old 3-column form scopes (income_column, account_column,
# obligations_column, edge_editor, resolved_panel, save) were removed with
# the Sankey redesign; the dialogs are bank_config / income_config /
# allocation_dialog.
en:
  plan_flows:
    show:
      title: Paycheck Flow
      subtitle: "Where each paycheck lands and what it pays — the family's money map for %{month}."
      view_aria: Paycheck flow view
      view_paycheck: Per Paycheck
      view_monthly: Per Month
      # Issue 10 (View/Manage): the diagram sizing-mode toggle (client-side
      # only — the sankey controller re-renders in place; MANAGE is the
      # default on load = the current behavior: floors keep every label
      # showable; VIEW is strictly proportional with the small-label hide).
      mode_aria: Diagram sizing mode
      mode_manage: Manage
      mode_view: View
      # Round 33 (spec 2): the paycheck-unit kebab (right of Manage/View).
      # Per Paycheck figures divide each income's monthly share by how many
      # times THAT income lands in the month (income, the DEFAULT) — or by
      # the month's total paycheck count (family, the old composite).
      unit_aria: Per-paycheck unit
      unit_income: Per income occurrence
      unit_family: Per paycheck event (family)
      legend_income: Incomes
      legend_banks: Banks
      legend_spending: Spending
      legend_debt: Debt
      legend_savings: Savings
      legend_surplus: Surplus
      over_plan: "Over-planned by %{amount} on %{income} — bills covered; reduce %{item}"
      # Round 31A (Fun Money v2): the RED Un-Allocated line (the second
      # group in the chrome-top, after the over-plan lines) + the C14
      # amber drift prompt (the stale-config nudge; NOT a mismatch).
      un_allocated: "%{income} — Un-Allocated %{amount}"
      inputs_stale: Inputs changed since last apply
      inputs_stale_reapply: Re-apply
      banks_not_planned:
        one: "%{count} account not planned yet"
        other: "%{count} accounts not planned yet"
      add_account: Add Account
      column_incomes: Incomes
      column_banks: Banks
      column_allocations: Allocations
      surplus_node: Surplus
      unallocated_node: Un-Allocated
      # The "No Assignment" marker for an allocation whose source bank was
      # removed from the plan (owner review round 3, R3).
      unassigned_node: No Assignment
      no_incomes: No income declared yet — add a paycheck income to start the map.
      # Round 31B (Direct Deposit): the bottom action row's entry point
      # (B1: the label is verbatim per the signed design).
      direct_deposit_review: Direct Deposit Review
      add_income: Add Income
      add_allocation: Add Allocation
      recommended: Recommended
      recommended_empty: Nothing recommended yet.
      chart_error: Couldn't draw the diagram — refresh the page.
      chart_empty: Nothing to plan this month yet.
    bank_config_dialog:
      title: "Configure %{name}"
      subtitle: Pull From Incomes, ownership, and role.
      # Round 20a: "Linked incomes" is now "Pull From Incomes"; each row
      # shows only checkbox + name until checked (the rule select + value
      # reveal in the same row).
      pull_from_incomes: Pull From Incomes
      no_incomes: No income declared yet.
      rule_aria: "Rule for %{name}"
      # Round 27 (owner items 3+4): short mode labels for the restyled
      # Pull-From-Incomes triggers (R26 trigger pattern; the long
      # round-20a labels are replaced).
      mode_required: Required
      mode_specific: Fixed Amount
      mode_percent: Percent
      mode_leftover: Leftover
      # Round 34 (spec 3): tooltip for the disabled "Leftover" option — a
      # member's paycheck may have at most ONE leftover account.
      leftover_single_hint: "One Leftover per member"
      # Round 34 (spec 3): the server backstop's 422 message — a forced
      # second leftover for the same paycheck (the UI greys the option, but
      # a crafted/forced save is rejected with a clear message).
      leftover_conflict: "One Leftover per member — %{name}'s paycheck already has a leftover account. Remove it there first."
      # Round 27 (owner item 4): the two-income Ratio trigger + the greyed
      # readouts/labels the dialog derives client-side (the ratio is never
      # submitted — it is re-derived from the stored per-income values).
      # Round 28: the behavior option labels are the owner's words (the
      # radio value= attributes stay equal/rational/fixed_amounts — only
      # the rendered labels change).
      ratio_label: Ratio
      ratio_equal: 50/50
      ratio_rational: Proportional Split
      ratio_fixed_amounts: Fixed Amounts
      # Round 30: the 4th behavior option (Percent of the required amount) —
      # a Required-mode-only control (the radio is disabled + hidden under
      # every other mode).
      ratio_percent: Percent
      # Round 28: the small grey labels above the between-row shared
      # block's two triggers (the owner's "Split Behavior" label + the
      # symmetric "Mode" label).
      mode_label: Mode
      split_behavior_label: Split Behavior
      # Round 30: the required note explains the persisted split (percents
      # of the required amount; blank = the equal split) and the leftover
      # note why the split behavior does not apply (C1: display-only).
      ratio_hidden_hint: "The required amount is split across the checked incomes — the split is saved as a percent of the required amount."
      ratio_leftover_hint: "Each paycheck's leftover is what each income has left after required, fixed, and percent — it is inherently per-income, so the split behavior does not apply."
      required_amount_label: "Required Amount: %{amount}"
      required_amount_total_label: "Required Amount: %{amount} (total)"
      total_amount_label: Total
      percent_hint: Percent of each paycheck (combined income).
      per_income_readout: "%{name}: %{amount}"
      per_income_readout_percent: "%{name}: %{amount} (%{percent})"
      mixed_modes: Mixed
      percent_of_each_paycheck: of each paycheck
      percent_placeholder: "0-100"
      specific_placeholder: "0.00"
      # Round 28 (R28-4): the "Details" disclosure is gone — ownership +
      # role stay always exposed in the bg-surface-inset panel.
      ownership_label: Ownership
      ownership_shared: Home / Shared
      role_label: Role
      # Round 20c: exactly the owner's five account kinds. A plain account
      # (nil role) gets the disabled "Plain" placeholder so a plain save
      # never silently promotes a role.
      role_plain: Plain
      role_savings_bucket: Savings
      role_checking: Checking
      role_credit_card_payoff: Credit Card
      role_loan_payoff: Loan
      role_investment: Investment
      # Round 20b: the "Sub-account of" select moved into the kebab as
      # "Make a Sub-Account" (same candidate set + the clear entry).
      menu_make_sub_account: Make a Sub-Account
      sub_account_hint: Pick the bank this account becomes a sub-account of. "Not a sub-account" removes the link.
      sub_account_none: Not a sub-account
      # Round 20e: the auto-transfer fan-out moved into the kebab.
      menu_configure_auto_transfer: Configure Auto-Transfer
      auto_transfer_targets: Auto-Transfer to (sub-accounts)
      auto_transfer_targets_hint: A bucket must first be set as a sub-account of this bank.
      # Round 20d: the old search + list section is gone; the avatar
      # (top-left of the dialog) opens the logo popup instead. Picking a
      # built-in while a custom upload is attached removes the custom.
      logo_popup_title: Bank logo
      logo_hint: Click the avatar to upload a logo or pick a built-in one.
      logo_upload: Upload Custom
      logo_remove_custom: Remove custom
      logo_builtin_heading: Built-in logos
      logo_none: None
      logo_upload_error_missing: No image file attached.
      logo_upload_error_type: Only PNG, JPEG, WebP, or GIF images can be used as a bank logo.
      logo_upload_error_size: The image is too large. Maximum 1 MB.
      more_aria: More options
      popup_cancel: Cancel
      save: Save
      # Remove from plan (owner review round 3, R3): the bank leaves the map;
      # its allocations persist unassigned ("No Assignment" marker).
      remove: Remove
      remove_confirm:
        one: "Remove this bank from the plan? Its %{count} allocation keeps its data but loses its source bank (shown as unassigned)."
        other: "Remove this bank from the plan? Its %{count} allocations keep their data but lose their source banks (shown as unassigned)."
        zero: Remove this bank from the plan?
      # Round 25 (Item 2): "Make Allocated Sub-Account" — the kebab item
      # that moves the opened account into the allocation pillar as its own
      # node (the target allocation), and the REVERSE it becomes once one
      # exists.
      menu_make_allocated_sub_account: Make Allocated Sub-Account
      menu_make_plain_bank_row: Make plain bank row
      # Round 26 R2 (owner items 3 + 5): the context-aware kebab matrix —
      # "Make Parent Account" (slot 1: opens the sub-account popup, whose
      # "Not a sub-account" entry clears the link; slot 2: the REVERSE that
      # destroys the target allocation) and the main-section "Parent
      # Account" labeled row + picker. menu_make_plain_bank_row is unused
      # since the matrix (the reverse item took its label) but the key is
      # kept. none_selected is the pending bank-source row placeholder (a
      # later round).
      make_parent_account: Make Parent Account
      parent_account: Parent Account
      none_selected: None Selected
      allocated_sub_title: Make Allocated Sub-Account
      allocated_sub_hint: "This account moves into the allocation pillar as its own node. The source bank below funds it with the amount you set — pick \"Make Parent Account\" in this menu to undo it."
      allocated_sub_name: Name
      allocated_sub_amount: How much you want to put in there
      allocated_sub_amount_hint: The monthly amount, prorated over this month's paychecks.
      allocated_sub_source: Source bank
      allocated_sub_source_hint: Pick the bank that funds it. The diagram draws the band from it into the account's node.
    income_config_dialog:
      title: "Configure %{name}"
      subtitle: Who this income belongs to and how many banks it can feed.
      owner_label: Owner / family member
      owner_fallback: Account owner (fallback)
      max_links_label: Max linked accounts
      max_links_placeholder: Unlimited
      max_links_hint: Blank = unlimited. A warning (not an error) shows when the limit is exceeded.
      add_family_member: Add a Family Member
      save: Save
    # Round 31B (Direct Deposit): the Direct Deposit Review dialog — one
    # tab per existing family member (B3). The form saves the member's
    # paycheck config (gross / frequency / anchor); the pay dates are
    # derived from the house Schedule engine (no occurrences stored).
    paycheck_config_dialog:
      title: Direct Deposit Review
      subtitle: "How each member's paycheck lands, for %{month}."
      no_series: "No income stream is labeled to %{name} yet."
      label_one_first: Label one first on the Bills paycheck page
      series_label: Income
      landing_account: Lands in
      gross_label: Gross per paycheck
      frequency_label: Frequency
      # B5 (owner flag): the frequency labels, and the default is
      # semi_monthly (the signed flag applies to paycheck configs).
      frequency_semi_monthly: Semi-monthly — 15th & last
      frequency_biweekly: Bi-weekly — every 2 weeks (26x/yr)
      anchor_label: Anchor date
      anchor_hint: Bi-weekly paychecks fire every 14 days from this date's weekday.
      derived_monthly: Derived monthly
      upcoming_label: Next pay dates
      upcoming_empty: Save a config to see the next pay dates.
      save: Save
      # Round 34 (spec 1): the STATIC READ-ONLY paycheck readout. The dialog is
      # no longer a form — each member tab is a read-only table of the accounts
      # the member's paycheck funds (per-paycheck amounts) plus the
      # max-direct-deposit-connections note. The account rows render
      # client-side from /plan/flow/graph; the header / note / series context
      # are server-rendered from the tab's labeled income series.
      header: "%{name} Paycheck"
      max_dd_label: Max direct deposit connections
      max_dd_not_set: Not Set
      account_header: Account
      amount_header: Direct Deposit Amount
      leftover_amount: "Leftover - %{amount}"
      leftover_only: Leftover
      no_rows: This paycheck has no direct deposit rows in the current plan.
    allocation_dialog:
      title_new: New Allocation
      title_edit: "Edit %{name}"
      subtitle: What gets pulled out of a source bank, and how much.
      known_heading: Known Allocations
      known_empty: No detected bills or subscriptions yet.
      known_all_planned: Everything detected is already in the diagram.
      new_hint: Start a bill from scratch, or pick one above.
      new_cta: Add New Allocation
      locked_tooltip: "Edit Details Grabbed from Tracked Accounts"
      name_label: Name
      kind_label: Kind
      kind_bill: Bill
      kind_debt: Debt
      kind_savings: Savings
      kind_fun_money: Fun money
      # Round 31A (Fun Money v2): the fun_money kind's configuration
      # fields (Ownership / Distribution / Mode / Matching). Rendered ONLY
      # for kind "fun_money" (kind-conditional blocks; every other kind's
      # dialog stays byte-identical).
      ownership_label: Ownership
      ownership_household: Household
      distribution_label: Distribution
      distribution_none: "—"
      distribution_equal: 50/50 Pooled Income
      distribution_rational: Proportional of Income
      distribution_percent: Percentage of Pooled
      distribution_individual_leftover: Individual Leftover by Allocations
      distribution_percent_hint: Per-member percents must total 100.00.
      # C3 = (a): the four existing Mode enum values with the bank-dialog
      # labels, reordered per the owner's list (no new enum value).
      fm_mode_leftover: Leftover
      fm_mode_percent: Percent of Leftover
      fm_mode_specific: Hard Number
      fm_mode_required: Required (Monthly)
      matching_label: Matching
      matching_equalize: "Equalize (same per user)"
      matching_per_income: "Per Income (own leftover)"
      matching_household: "— Household"
      fun_money_multiple_hint: Several Fun Money rows exist — the first one (by diagram order) drives the reconciliation.
      # Round 20 two-stack rework (U): the dialog is two disclosure stacks.
      # Stack 1 "Configure the allocation" shows only what is NOT pulled from
      # the detected bill (name / amount / cadence / mode render read-only
      # context when a bill is linked; the category picker is always
      # editable). Stack 2 "Bank source" is the source-bank selector with
      # the account's plan-flow logo. Kind "savings" / "fun_money" show only
      # name + monthly amount; the bill-only fields (mode / cadence / RT
      # link) render only for kind "bill" / "debt".
      section_configure: Configure the allocation
      section_bank_source: Bank source
      # Round 25 R3: the collapsed "More options" disclosure (Kind /
      # Cadence / Category — the per-kind second-tier fields).
      more_options: More options
      linked_context_hint: Pulled from the detected bill, so these values are read-only here.
      linked_bill_label: Linked bill
      source_bank_label: Source bank
      # Optional but recommended (owner review round 3, R3): an unassigned
      # allocation ("No Assignment" marker) can pick a source bank again.
      source_bank_unassigned: No bank (unassigned)
      # Round 26 R4 (item 6): the bank-source trigger's selection text when
      # the allocation has no source bank (paired with the profile icon).
      none_selected: None Selected
      # Round 21 T8: empty-state hint for the in-place-swappable BANK
      # SOURCE rows (plan_flows/_allocation_bank_rows.html.erb) when no
      # account is on the plan yet.
      empty_bank_rows: "Add accounts first: use Add Account."
      source_bank_hint: Pick the bank this allocation pays from. Unassigned allocations wait outside the resolution.
      # Owner round 10 (issue 4): the savings-bucket view of the same two
      # fields. The associated account IS the existing source-bank field
      # (account_id): the planner resolution and the Sankey band both key
      # off it, so no second column exists. The monthly figure is the
      # existing value field with mode "required" (monthly, prorated over
      # the month's paychecks). The bill-only fields (mode / cadence /
      # detected-bill link) are hidden for kind "savings" and "fun_money".
      savings_account_label: Which Account is this Savings Bucket Associated to
      savings_account_hint: Pick the account this savings bucket is associated to. The diagram draws the monthly band from it into the bucket.
      savings_value_label: How much to save Per Month
      savings_value_hint: The monthly amount, prorated over this month's paychecks.
      # Round 20 (U): the fun-money view of the same two fields.
      fun_account_hint: Pick the account this allocation is associated to. The diagram draws the monthly band from it.
      fun_value_label: How much to set aside Per Month
      fun_value_hint: The monthly amount, prorated over this month's paychecks.
      mode_label: Mode
      mode_required: Required
      mode_specific: Hard number
      mode_percent: Percent of leftover
      mode_leftover: Leftover
      value_label: Amount
      amount_monthly_label: Amount (monthly)
      required_hint: The required amount is a MONTHLY figure, prorated over this month's paychecks.
      cadence_label: Cadence
      cadence_weekly: Weekly
      cadence_biweekly: Biweekly
      cadence_monthly: Monthly
      cadence_quarterly: Quarterly
      cadence_yearly: Yearly
      link_rt_label: Link a detected bill or debt
      rt_none: None
      rt_linked: Linked bill
      # Round 16 (owner note 2) keys the ERB already used but that were
      # missing from this file (the live dialog rendered the raw i18n
      # fallback). Category picker: the app's existing categories with the
      # same color + icon as the house category lists.
      category_label: Category
      category_hint: The category's color tints this allocation's band in the diagram.
      category_none: No category
      delete: Delete
      save: Save
    # Full template (not a partial) — scope is "plan_flows.account_modal".
    # Owner round 2 (F2): the modal lists Sure's existing accounts only; the
    # manual creation form is gone (the page must not keep its own account
    # list) — "Add Manual Account" links to the house add-account page.
    common:
      # The shared 422 in-place response message (owner review round 3,
      # R1/R7): rendered inline in the dialog, no full-page flash.
      save_failed: That didn't pass the model's checks — check the values and try again.
    account_modal:
      title: Add Account
      subtitle: Pick an account Sure already knows — it joins the map at $0.
      existing_heading: Existing accounts
      all_on_map: Every account is already on the map.
      add_selected: Add to map
      manual_heading: New account
      manual_description: To add an account Sure doesn't have yet, use the usual add-account page.
      manual_cta: Add Manual Account
      cancel: Cancel
    add_accounts:
      accounts_added: Account(s) added to the map.
    update_account:
      save_failed: The account update didn't pass the model's checks — check the values and try again.
    # Round 20d: the avatar popup's custom-logo upload (plan_flows#upload_bank_logo).
    upload_bank_logo:
      bank_logo_missing_file: No image file attached.
      bank_logo_not_an_image: Only PNG, JPEG, WebP, or GIF images can be used as a bank logo.
      bank_logo_too_large: The image is too large. Maximum 1 MB.
    remove_bank_logo:
      removed: Custom logo removed.
    update_income:
      save_failed: The income update didn't pass the model's checks — check the values and try again.
    # Round 31B (Direct Deposit): the paycheck-config save (HTML path
    # flashes; the JSON path uses the model's field errors instead).
    update_paycheck_config:
      no_series: That member has no income stream labeled to them yet — label one on the Bills paycheck page first.
      save_failed: The paycheck config didn't pass the model's checks — check the values and try again.
    create_allocation:
      saved: Allocation saved.
      save_failed: That allocation didn't pass the model's checks — check the amount and try again.
    update_allocation:
      saved: Allocation saved.
      save_failed: That allocation didn't pass the model's checks — check the amount and try again.
    destroy_allocation:
      saved: Allocation removed.
    remove_account:
      removed: Bank removed from the plan.
      has_target_allocation: This account is the target of an allocation — remove that allocation first.
      has_sub_accounts: This account still has sub-accounts — remove them from the plan first.
